<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>❤️ BlurTrend</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #111111,
                    #1d1d1d
                );

            color: white;

            font-family:
                Arial,
                sans-serif;

            text-align: center;

        }


        h1 {

            margin:
                20px
                0
                10px;

            font-size: 35px;

        }


        .container {

            width: 95%;

            max-width: 900px;

            margin: auto;

        }


        #camera {

            width: 100%;

            display: block;

            border-radius: 18px;

            background: #222;

            transform:
                scaleX(-1);

            transition:
                filter 0.2s ease;

        }


        .controls {

            margin-top: 15px;

        }


        select {

            width: 90%;

            max-width: 500px;

            padding: 13px;

            border-radius: 10px;

            border: none;

            font-size: 16px;

            margin-bottom: 10px;

        }


        button {

            padding:
                14px
                25px;

            border: none;

            border-radius: 10px;

            font-size: 17px;

            cursor: pointer;

            background: white;

            color: #111;

        }


        button:disabled {

            opacity: 0.5;

            cursor:
                not-allowed;

        }


        #status {

            margin: 15px;

            font-size: 18px;

            min-height: 25px;

        }


        .instruction {

            margin-top: 10px;

            color: #cccccc;

            font-size: 15px;

        }


        #canvas {

            display: none;

        }

    </style>

</head>


<body>


    <h1>
        ❤️ BlurTrend
    </h1>


    <div class="container">


        <!-- VIDEO KAMERA -->

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>


        <!-- CANVAS -->

        <canvas
            id="canvas">
        </canvas>


        <!-- KONTROL -->

        <div class="controls">


            <select id="cameraSelect">

                <option value="">
                    Pilih Kamera
                </option>

            </select>


            <br>


            <button id="startButton">

                📷 Nyalakan Kamera

            </button>


        </div>


        <!-- STATUS -->

        <div id="status">

            ⏳ Menyiapkan sistem...

        </div>


        <div class="instruction">

            Angkat dua jari ✌️ untuk
            mengaktifkan Blur + ❤️

        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="/static/js/script.js">
    </script>


</body>

</html>
